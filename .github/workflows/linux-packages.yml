name: Linux packages

on:
  push:
    tags: ['v*']

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packaging tools (fakeroot, rpmbuild)
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Build the desktop jar
        run: mvn -B -ntp -q -pl agna-desktop -am package -DskipTests

      - name: Build the .deb and .rpm installers (jpackage)
        run: |
          mkdir -p ~/pkg ~/out
          cp agna-desktop/target/agna-2.1.3.jar ~/pkg/agna-2.1.3.jar
          jpackage --type deb --name agna --app-version 2.1.3 \
            --vendor "Marius Ion Bența" --input ~/pkg --main-jar agna-2.1.3.jar \
            --main-class com.bentza.sna.Agna --dest ~/out
          jpackage --type rpm --name agna --app-version 2.1.3 \
            --vendor "Marius Ion Bența" --input ~/pkg --main-jar agna-2.1.3.jar \
            --main-class com.bentza.sna.Agna --dest ~/out

      - name: Validate the packages (dpkg-deb and rpm)
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq rpm cpio >/dev/null 2>&1
          dpkg-deb --info ~/out/*.deb | head -8
          rpm -qpi ~/out/*.rpm | head -10
          rpm2cpio ~/out/*.rpm | cpio -t 2>/dev/null | head -6

      - name: Upload the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: ~/out/*
          if-no-files-found: error
