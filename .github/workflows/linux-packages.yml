name: Linux packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packaging tools (fakeroot, rpmbuild)
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Build the desktop jar
        run: mvn -B -ntp -q -pl agna-desktop -am package -DskipTests

      - name: Build the .deb and .rpm installers (jpackage)
        run: |
          mkdir -p ~/pkg ~/out
          JAR=$(ls agna-desktop/target/agna-*.jar | head -1)
          JARNAME=$(basename "$JAR")
          cp "$JAR" ~/pkg/"$JARNAME"
          jpackage --type deb --name agna --app-version 2.2.1 \
            --vendor "Marius Ion Bența" --input ~/pkg --main-jar "$JARNAME" \
            --main-class com.bentza.sna.Agna --dest ~/out
          jpackage --type rpm --name agna --app-version 2.2.1 \
            --vendor "Marius Ion Bența" --input ~/pkg --main-jar "$JARNAME" \
            --main-class com.bentza.sna.Agna --dest ~/out
          mkdir -p ~/portable/agna
          cp "$JAR" ~/portable/agna/
          tar -czf ~/out/AGNA-2.2.1-Linux-x64.tar.gz -C ~/portable agna

      - name: Validate the packages (dpkg-deb and rpm)
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq rpm cpio >/dev/null 2>&1
          dpkg-deb --info ~/out/*.deb | head -8
          rpm -qpi ~/out/*.rpm | head -10
          rpm2cpio ~/out/*.rpm | cpio -t 2>/dev/null | head -6

      - name: Upload the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: ~/out/*
          if-no-files-found: error

      - name: Upload packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ~/out/* --clobber
