name: Windows installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the desktop jar
        run: mvn -B -ntp -q -pl agna-desktop -am package -DskipTests

      - name: Build the .msi and .exe installers (jpackage, WiX auto-downloaded)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg, out | Out-Null
          $jar = Get-ChildItem -Path agna-desktop\target\agna-*.jar | Select-Object -First 1
          Copy-Item $jar.FullName pkg\$($jar.Name)
          # exactly the 2.2.1 sample set (packaging/samples-manifest.txt), never the whole samples folder
          New-Item -ItemType Directory -Force pkg\samples | Out-Null
          Get-Content packaging\samples-manifest.txt | Where-Object { $_.Trim() } | ForEach-Object { Copy-Item -LiteralPath "samples\$_" -Destination pkg\samples\ -ErrorAction Stop }
          jpackage --type msi --name AGNA --app-version 2.2.2 `
            --vendor "Marius Ion Benta" `
            --description "AGNA - Applied Graph and Network Analysis Open Source" `
            --icon packaging\Agna.ico --input pkg --main-jar $jar.Name `
            --main-class com.bentza.sna.Agna --dest out
          jpackage --type exe --name AGNA --app-version 2.2.2 `
            --vendor "Marius Ion Benta" `
            --description "AGNA - Applied Graph and Network Analysis Open Source" `
            --icon packaging\Agna.ico --input pkg --main-jar $jar.Name `
            --main-class com.bentza.sna.Agna --dest out

      - name: Upload the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out\*
          if-no-files-found: error

      - name: Upload installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} out/* --clobber
