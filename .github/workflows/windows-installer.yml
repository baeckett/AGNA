name: Windows installer

on:
  push:
    tags: ['v*']

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the desktop jar
        run: mvn -B -ntp -q -pl agna-desktop -am package -DskipTests

      - name: Build the .msi and .exe installers (jpackage, WiX auto-downloaded)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg, out | Out-Null
          Copy-Item agna-desktop\target\agna-2.1.3.jar pkg\agna-2.1.3.jar
          jpackage --type msi --name AGNA --app-version 2.1.3 `
            --vendor "Marius Ion Bența" `
            --description "AGNA - Applied Graph and Network Analysis Open Source" `
            --icon packaging\Agna.ico --input pkg --main-jar agna-2.1.3.jar `
            --main-class com.bentza.sna.Agna --dest out
          jpackage --type exe --name AGNA --app-version 2.1.3 `
            --vendor "Marius Ion Bența" `
            --description "AGNA - Applied Graph and Network Analysis Open Source" `
            --icon packaging\Agna.ico --input pkg --main-jar agna-2.1.3.jar `
            --main-class com.bentza.sna.Agna --dest out

      - name: Upload the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out\*
          if-no-files-found: error
