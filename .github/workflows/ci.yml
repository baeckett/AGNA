name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run the full test suite (unit, round-trip, stress, fuzz, rendering)
        run: mvn -B verify

      - name: Upload the built jar as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: agna-2.1.3.jar
          path: agna-desktop/target/agna-2.1.3.jar
          if-no-files-found: error

  sbom-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the aggregate CycloneDX BOM
        run: mvn -B -ntp -q org.cyclonedx:cyclonedx-maven-plugin:2.7.10:makeAggregateBom

      - name: SBOM license/vuln policy gate (blocking)
        run: |
          python3 tools/sbom_gate.py target/bom.json
          python3 -c "import json; d=json.load(open('target/bom.json')); print('components:', len(d.get('components', [])))"

      - name: Convert to SPDX (ISO/IEC 5962)
        run: |
          curl -sL -o /tmp/cyclonedx https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.25.0/cyclonedx-linux-x64
          chmod +x /tmp/cyclonedx
          /tmp/cyclonedx convert --input-file target/bom.json \
            --output-format spdxjson --output-file target/bom.spdx.json
          python3 -c "import json; json.load(open('target/bom.spdx.json')); print('SPDX JSON valid')"

      # The heavier OWASP NVD scan is intentionally NOT part of CI: it
      # downloads CVE feeds and can take many minutes. Run it locally when
      # preparing a release:  mvn -Psbom-gate verify -Ddependency-check.skip=false

      - name: Upload the SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            target/bom.json
            target/bom.spdx.json
          if-no-files-found: error